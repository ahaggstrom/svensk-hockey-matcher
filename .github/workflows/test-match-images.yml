
name: Testa matchbilder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Hamta repository
        uses: actions/checkout@v4

      - name: Installera R
        uses: r-lib/actions/setup-r@v2

      - name: Installera bildbibliotek
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagick++-dev librsvg2-dev

      - name: Installera paket
        run: |
          Rscript -e 'install.packages("pak")'
          Rscript -e 'install.packages("curl")'
          Rscript -e 'install.packages("magick")'
          Rscript -e 'install.packages("rsvg")'
          Rscript -e 'pak::pkg_install("sportsdataverse/fastRhockey")'

      - name: Skapa testbilder
        run: |
          Rscript scripts/test_match_images.R

      - name: Spara bilder i GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players/generated/
          git diff --cached --quiet || git commit -m "Generate hockey match images"
          git push
