
name: Testa spelarportratt

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Hamta repository
        uses: actions/checkout@v4

      - name: Installera R
        uses: r-lib/actions/setup-r@v2

      - name: Installera bildbibliotek
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagick++-dev

      - name: Installera paket
        run: |
          Rscript -e 'install.packages("pak")'
          Rscript -e 'install.packages("curl")'
          Rscript -e 'install.packages("magick")'
          Rscript -e 'pak::pkg_install("sportsdataverse/fastRhockey")'

      - name: Ladda ner AIK:s spelarportratt
        run: |
          Rscript scripts/download_players.R

      - name: Spara bilder i GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players/
          git diff --cached --quiet || git commit -m "Update AIK player portraits"
          git push
