
name: Testa IPTV matchning

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-iptv:
    runs-on: ubuntu-latest

    steps:
      - name: Hamta repository
        uses: actions/checkout@v4

      - name: Installera R
        uses: r-lib/actions/setup-r@v2

      - name: Installera paket
        run: |
          Rscript -e 'install.packages("curl")'
          Rscript -e 'install.packages("jsonlite")'

      - name: Skapa IPTV-bildkopior
        env:
          IPTV_HOST: ${{ secrets.IPTV_HOST }}
          IPTV_USERNAME: ${{ secrets.IPTV_USERNAME }}
          IPTV_PASSWORD: ${{ secrets.IPTV_PASSWORD }}
        run: |
          Rscript scripts/test_iptv_matching.R

      - name: Spara bildkopior i GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players/generated/
          git diff --cached --quiet || git commit -m "Add IPTV channel logo copies"
          git push
