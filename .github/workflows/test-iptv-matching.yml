
name: Testa IPTV matchning

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-matching
  cancel-in-progress: false

jobs:
  test-iptv:
    runs-on: ubuntu-latest

    steps:
      - name: Kontrollera svensk tid
        id: time
        run: |
          HOUR=$(TZ=Europe/Stockholm date +%H)
          MINUTE=$(TZ=Europe/Stockholm date +%M)

          if [ "$MINUTE" = "00" ] && [[ "$HOUR" =~ ^(08|14|17)$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Svensk tid: $(TZ=Europe/Stockholm date)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Ingen schemalagd körning just nu."
          fi

      - name: Hamta repository
        if: steps.time.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Installera R
        if: steps.time.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: r-lib/actions/setup-r@v2

      - name: Installera paket
        if: steps.time.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          Rscript -e 'install.packages("curl")'
          Rscript -e 'install.packages("jsonlite")'

      - name: Skapa IPTV-bildkopior
        if: steps.time.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          IPTV_HOST: ${{ secrets.IPTV_HOST }}
          IPTV_USERNAME: ${{ secrets.IPTV_USERNAME }}
          IPTV_PASSWORD: ${{ secrets.IPTV_PASSWORD }}
        run: |
          Rscript scripts/test_iptv_matching.R

      - name: Spara bildkopior i GitHub
        if: steps.time.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players/generated/
          git diff --cached --quiet || git commit -m "Update IPTV channel logo copies"
          git push
