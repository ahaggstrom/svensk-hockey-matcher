
name: Uppdatera matchbilder och IPTV-logotyper

on:
  schedule:
    # Vintertid: 08:00, 14:00 och 17:00 svensk tid
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
    - cron: '0 16 * * *'

    # Sommartid: 08:00, 14:00 och 17:00 svensk tid
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hockey-match-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Kontrollera schemalagd körning
        id: time
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Aktuell svensk tid: $(TZ=Europe/Stockholm date)"
          echo "Schemalagd UTC-tid: $SCHEDULE"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manuell körning godkänd."
            exit 0
          fi

          UTC_HOUR=$(echo "$SCHEDULE" | awk '{print $2}')
          OFFSET=$(TZ=Europe/Stockholm date +%z)

          OFFSET_SIGN=${OFFSET:0:1}
          OFFSET_VALUE=${OFFSET:1:2}

          OFFSET_HOURS=$((10#$OFFSET_VALUE))

          if [ "$OFFSET_SIGN" = "-" ]; then
            OFFSET_HOURS=$((-OFFSET_HOURS))
          fi

          UTC_HOUR=$((10#$UTC_HOUR))
          LOCAL_HOUR=$(((UTC_HOUR + OFFSET_HOURS + 24) % 24))

          echo "Beräknad svensk schematid: ${LOCAL_HOUR}:00"

          if [[ "$LOCAL_HOUR" =~ ^(8|14|17)$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Schemalagd körning godkänd."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Denna UTC-tid gäller inte svensk schematid."
          fi

      - name: Hämta repository
        if: steps.time.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Installera R
        if: steps.time.outputs.run == 'true'
        uses: r-lib/actions/setup-r@v2

      - name: Installera bildbibliotek
        if: steps.time.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagick++-dev librsvg2-dev

      - name: Installera paket
        if: steps.time.outputs.run == 'true'
        run: |
          Rscript -e 'install.packages("pak")'
          Rscript -e 'install.packages("curl")'
          Rscript -e 'install.packages("magick")'
          Rscript -e 'install.packages("rsvg")'
          Rscript -e 'install.packages("jsonlite")'
          Rscript -e 'install.packages("rvest")'
          Rscript -e 'pak::pkg_install("sportsdataverse/fastRhockey")'

      - name: Uppdatera laglistan
        if: steps.time.outputs.run == 'true'
        run: |
          Rscript scripts/update_teams.R

      - name: Skapa matchbilder
        if: steps.time.outputs.run == 'true'
        run: |
          Rscript scripts/test_match_images.R

      - name: Skapa IPTV-bildkopior
        if: steps.time.outputs.run == 'true'
        env:
          IPTV_HOST: ${{ secrets.IPTV_HOST }}
          IPTV_USERNAME: ${{ secrets.IPTV_USERNAME }}
          IPTV_PASSWORD: ${{ secrets.IPTV_PASSWORD }}
        run: |
          Rscript scripts/test_iptv_matching.R

      - name: Spara resultat i GitHub
        if: steps.time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players/generated/ scripts/teams.csv
          git diff --cached --quiet || git commit -m "Update hockey match images and IPTV logos"
          git push
